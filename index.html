<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Machine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="deck">
      <header class="deck__header">
        <div class="deck__title-block">
          <h1 class="deck__title">Post Machine</h1>
        </div>
        <div class="deck__status">
          <span class="lamp lamp--idle" aria-hidden="true"></span>
          <span class="deck__status-text">Stopped</span>
        </div>
      </header>

      <section class="panel tape-panel" aria-labelledby="tape-heading">
        <div class="panel__head">
          <h2 class="panel__label" id="tape-heading">Tape</h2>
          <span class="panel__hint"></span>
        </div>

        <div class="tape-rig">
          <button class="cell-add" type="button" aria-label="Add cell left">
            <span>+</span>
          </button>

          <button class="cell-add" type="button" aria-label="Remove cell left">
            <span>-</span>
          </button>

          <button class="stepper" type="button" aria-label="Move head left">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                d="M15 5 8 12l7 7"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <div class="tape-window">
            <div class="sprocket sprocket--top" aria-hidden="true"></div>
            <ol class="tape"></ol>
            <div class="sprocket sprocket--bottom" aria-hidden="true"></div>
          </div>

          <button class="stepper" type="button" aria-label="Move head right">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path
                d="M9 5l7 7-7 7"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <button class="cell-add" type="button" aria-label="Remove cell right">
            <span>-</span>
          </button>

          <button class="cell-add" type="button" aria-label="Add cell right">
            <span>+</span>
          </button>
        </div>
      </section>

      <section class="panel run-panel" aria-labelledby="run-heading">
        <div class="panel__head">
          <h2 class="panel__label" id="run-heading">Controls</h2>
        </div>

        <div class="run-rig">
          <div class="transport">
            <button class="btn btn--run" type="button">
              <svg
                viewBox="0 0 16 16"
                width="14"
                height="14"
                aria-hidden="true"
              >
                <path d="M3 1.5v13l11-6.5z" fill="currentColor" />
              </svg>
              Run
            </button>
            <button class="btn btn--pause" type="button">
              <svg
                viewBox="0 0 16 16"
                width="14"
                height="14"
                aria-hidden="true"
              >
                <path d="M3 2h3v12H3zM10 2h3v12h-3z" fill="currentColor" />
              </svg>
              Pause
            </button>
            <button class="btn btn--stop" type="button">
              <svg
                viewBox="0 0 16 16"
                width="14"
                height="14"
                aria-hidden="true"
              >
                <rect
                  x="2.5"
                  y="2.5"
                  width="11"
                  height="11"
                  fill="currentColor"
                />
              </svg>
              Stop
            </button>
          </div>

          <fieldset class="speed">
            <legend class="speed__legend">Step Speed</legend>
            <div class="speed__options">
              <label class="speed__option">
                <input type="radio" name="speed" value="instant" checked />
                <span>Instant</span>
              </label>
              <label class="speed__option">
                <input type="radio" name="speed" value="0.5" />
                <span>0.5 s</span>
              </label>
              <label class="speed__option">
                <input type="radio" name="speed" value="1" />
                <span>1 s</span>
              </label>
              <label class="speed__option">
                <input type="radio" name="speed" value="2" />
                <span>2 s</span>
              </label>
            </div>
          </fieldset>
        </div>
      </section>

      <section class="panel program-panel" aria-labelledby="program-heading">
        <div class="panel__head">
          <h2 class="panel__label" id="program-heading">Program</h2>
          <span class="panel__hint"></span>
        </div>

        <ol class="program"></ol>

        <button class="add-cmd" type="button">
          <span class="add-cmd__icon" aria-hidden="true">+</span>
          Add command
        </button>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
